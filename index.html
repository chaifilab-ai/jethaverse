<!doctype html>
<html lang="en">
<head>

      <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>

  <div class="app" id="app" data-state="loading">
    <!-- the loading shell; app.js replaces it once the episode list is ready -->
    <header class="appbar"><div class="brand">JethaVerse<small>Find any Taarak Mehta episode</small></div></header>
    <div class="shell-search" aria-hidden="true"></div>
    <section class="panel shell">
      <div class="phead"><span class="tx"><b>…</b> <span>episodes</span></span></div>
      <div class="plist"><div class="results" aria-busy="true"><div class="skeleton"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    </section>
    <noscript><p class="nojs">JethaVerse needs JavaScript to search the episodes.</p></noscript>
  </div>

  <script src="data/episodes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
